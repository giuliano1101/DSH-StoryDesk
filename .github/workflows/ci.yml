name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pinned pnpm and locked dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Select runtime under test
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Core and documentation tests
        run: |
          node --version
          npm test
          npm run test:docs
      - name: Build before packaging tests
        run: |
          npm run build
          npm run test:sites
      - name: Pack installable bundle
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          mkdir -p release-assets
          pnpm pack --pack-destination release-assets
          cd release-assets
          sha256sum ./*.tgz > SHA256SUMS.txt
          cd ..
          cp LICENSE THIRD_PARTY_NOTICES.md docs/installation.md release-assets/
          pnpm list --prod --depth Infinity --json > release-assets/dependencies.json
      - name: Keep verified package for maintainers
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storydesk-verified-package-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
